[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = { workspace = true }
lib = { workspace = true }
egui = { version = "0.34", features = ["serde"] }
eframe = { version = "0.34", features = ["serde"] }
petgraph = { version = "0.8.3", features = ["serde-1"] }
rfd = "0.17.2"
egui_extras = { version = "0.34", features = ["svg"] }
egui_code_editor = "0.2.21"
subsecond = "0.7.3"
dioxus-devtools = "0.7.3"
env_logger = "0.11.10"
enum_dispatch = "0.3.13"
serde = "1.0.228"
serde_json = "1.0.149"
postcard = { version = "1.1.3", features = ["use-std"] }
egui_dnd = "0.15.0"
typst = "0.14.2"
typst-svg = "0.14.2"
time = { version = "0.3.47", features = ["local-offset"] }
egui_plot = "0.35.0"
derive_more = { version = "2.1.1", features = ["try_into", "unwrap"] }
wry = "0.55.0"

[target.'cfg(linux)'.dependencies]
gtk = "0.18.2"
