[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = { workspace = true }
dioxus-devtools = "0.7.3"
eframe = { version = "0.34", features = ["serde"] }
egui = { version = "0.34", features = ["serde"] }
egui_code_editor = "0.2.21"
egui_dnd = "0.15.0"
egui_plot = "0.35.0"
enum_dispatch = "0.3.13"
env_logger = "0.11.10"
lib = { workspace = true }
petgraph = { version = "0.8.3", features = ["serde-1"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rfd = "0.17.2"
serde = "1.0.228"
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
subsecond = "0.7.3"
time = { version = "0.3.47", features = ["local-offset"] }
typst = "0.14.2"
typst-svg = "0.14.2"
wry = "0.55.0"

egui_extras = { version = "0.34", features = ["file", "image", "svg"] }
image = { version = "0.25.10" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
