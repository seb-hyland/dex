[workspace]
resolver = "3"
members = ["sources/*"]

[workspace.dependencies]
arrow = { version = "59.2.0", features = ["csv", "ipc", "ipc_compression", "pyarrow"] }
csv-nose = "1.2.0"
dex-dynamic.path = "sources/dynamic/"
dyn-clone = "1.0.20"
egui = { version = "0.35.0", features = ["serde"] }
egui_extras = { version = "0.35.0", features = ["image", "svg"] }
inventory = "0.3.22"
memmap2 = "0.9.11"
parking_lot = "0.12.5"
petgraph = { version = "0.8.3", features = ["serde-1"] }
pyo3 = { version = "0.29.0", features = ["auto-initialize", "macros", "multiple-pymethods"] }
rpds = { version = "1.2.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
slotmap = { version = "1.1.1", features = ["serde"] }
steel-core = "0.8.3"
typetag = "0.2.22"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-svg = "0.15.1"
utils.path = "sources/utils/"
utils-proc-macro.path = "sources/utils-proc-macro/"
uuid = { version = "1.23.4", features = ["serde", "v4", "v5", "v7"] }
