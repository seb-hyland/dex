[workspace]
resolver = "3"
members = ["sources/*"]

[workspace.dependencies]
dyn-clone = "1.0.20"
egui = { version = "0.35.0", features = ["serde"] }
petgraph = { version = "0.8.3", features = ["serde-1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
typetag = "0.2.22"
utils.path = "sources/utils/"
utils-proc-macro.path = "sources/utils-proc-macro/"
